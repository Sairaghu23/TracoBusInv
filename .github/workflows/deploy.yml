name: Secure Deploy TracoBus

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
         script: |
            set -e

            # 1. Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Navigate and Clean
            cd ~/tracobusinvcicd
            
            # Remove untracked files (like the dist folder contents) that block merges
            git clean -fd 
            
            # Handle any tracked local changes (like .env if tracked)
            git stash
            git pull origin main
            git stash pop || true 
            
            # 3. Build Frontend
            cd frontend
            npm install
            # Ensure binaries are executable
            chmod -R +x node_modules/.bin
            npm run build
            
            # Sync to the Nginx web root
            cp -rvf dist/* /var/www/tracobusinvcicd/frontend/
            
            # 4. Update Backend
            cd ../backend
            npm install
            
            # Restart the backend
            pm2 restart backend || pm2 start server.js --name "backend"
            
            echo "Deployment successful!"
