name: Secure Deploy TracoBus

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Crucial: Stop if any command fails!

            # 1. Load NVM into this session
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Go to project and pull
            cd ~/tracobusinvcicd
            
            # Handle the .env conflict automatically
            git stash
            git pull origin main
            git stash pop || true # Re-apply .env changes; ignore if no changes existed
            
            # 3. Build Frontend
            cd frontend
            npm install
            chmod -R +x node_modules/.bin
            npm run build
            # We already verified /var/www/tracobusinvcicd/frontend is the correct Nginx root
            cp -rvf dist/* /var/www/tracobusinvcicd/frontend/
            
            # 4. Update Backend
            cd ../backend
            npm install
            
            # Restart the backend
            pm2 restart backend || pm2 start server.js --name "backend"
            
            echo "Deployment successful!"
