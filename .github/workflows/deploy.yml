name: Secure Deploy TracoBus

on:
  push:
    branches: [ main ] # Only deploys when you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to your sandbox
            cd ~/tracobusinvcicd
            
            # 2. Pull the latest code from your private repo
            git pull origin main            
            
            # 3. Build Frontend
            cd frontend
            npm install
            npm run build
            # Copy build to the folder Nginx looks at
            cp -r dist/* /var/www/tracobusinvcicd/frontend/
            
            # 4. Update Backend
            cd ../backend
            npm install
            # Restart the process in PM2 (or start if it's the first time)
            pm2 restart backend || pm2 start server.js --name "backend "
