name: Secure Deploy TracoBus

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # 1. Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Navigate
            cd ~/tracobusinvcicd
            
            # Force the server to match the GitHub repository
            # This replaces 'git pull' and 'git stash'
            git fetch origin main
            git reset --hard origin/main
            
            # Remove any untracked files (build artifacts/node_modules leftovers)
            git clean -fd
            
            # 3. Build Frontend
            cd frontend
            npm install
            # Ensure permissions are correct
            chmod -R +x node_modules/.bin
            npm run build
            
            # Copy to Nginx web root (Ensure your CI/CD user has write permissions here)
            cp -rvf dist/* /var/www/tracobusinvcicd/frontend/
            
            # 4. Update Backend
            cd ../backend
            npm install
            
            # Restart the backend
            pm2 restart backend || pm2 start server.js --name "backend"
            
            echo "Deployment successful!"
