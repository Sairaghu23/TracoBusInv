name: Secure Deploy TracoBus

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Load NVM into this session
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 2. Go to project and pull
            cd ~/tracobusinvcicd
            git pull origin main            
            
            # 3. Build Frontend
            cd frontend
            npm install
            npm run build
            cp -r dist/* /var/www/tracobusinvcicd/frontend/
            
            # 4. Update Backend
            cd ../backend
            npm install
            # Using the full path for pm2 just in case, or make sure it's in NVM
            pm2 restart backend || pm2 start server.js --name "backend"
